// browser-handoff loader: goes in the Firefox install dir (Arch: /usr/lib/firefox/). Autoconfig skips this first line.
// It only imports ~/.agent-mesh/firefox/handoff.sys.mjs, so the real code updates with the mesh (no sudo again).
try {
  const file = Services.dirsvc.get("Home", Ci.nsIFile);
  for (const part of [".agent-mesh", "firefox", "handoff.sys.mjs"]) file.append(part);
  if (file.exists()) {
    // Modules must come from a trusted scheme, so map the folder to resource://browser-handoff/ first.
    Services.io.getProtocolHandler("resource").QueryInterface(Ci.nsIResProtocolHandler)
      .setSubstitution("browser-handoff", Services.io.newFileURI(file.parent));
    ChromeUtils.importESModule("resource://browser-handoff/" + file.leafName).register();
  }
} catch (e) {
  Cu.reportError("browser-handoff: " + e);
}
